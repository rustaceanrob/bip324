name: Update Lockfiles

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at 00:00 UTC.
  workflow_dispatch:     # Allow manual triggering.

jobs:
  update-lockfiles:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@ab53238ea36685e2676e2afc4dadcefbf4c2d643
      - name: Configure git
        run: |
          git config user.name "RBMT Bot"
          git config user.email "bot@example.com"
      - name: Update lockfiles and commit
        run: |
          cargo rbmt lock
          if git add . && git commit -m "Update lockfiles"; then
            echo "LOCKFILE_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update fuzz lockfiles and commit
        working-directory: fuzz
        run: |
          cargo rbmt lock
          if git add . && git commit -m "fuzz: update lockfiles"; then
            echo "LOCKFILE_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update protocol/bitcoind-tests lockfiles and commit
        working-directory: protocol/bitcoind-tests
        run: |
          cargo rbmt lock
          if git add . && git commit -m "bitcoind-tests: update lockfiles"; then
            echo "LOCKFILE_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update traffic/bitcoind-tests lockfiles and commit
        working-directory: traffic/bitcoind-tests
        run: |
          cargo rbmt lock
          if git add . && git commit -m "bitcoind-tests: update lockfiles"; then
            echo "LOCKFILE_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Create pull request
        if: ${{ env.LOCKFILE_UPDATE == 'true' }}
        run: |
          git push origin HEAD:refs/for/main/update-lockfiles \
            -o title="Update lockfiles" \
            -o description="Automated update to lockfiles by update-lockfiles workflow."
