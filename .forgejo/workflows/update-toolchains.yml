name: Update Toolchains

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC.
  workflow_dispatch:     # Allow manual triggering.

jobs:
  update-toolchains:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@ab53238ea36685e2676e2afc4dadcefbf4c2d643
      - name: Configure git
        run: |
          git config user.name "RBMT Bot"
          git config user.email "bot@example.com"
      - name: Update nightly version and commit
        run: |
          cargo rbmt toolchains --update-nightly
          if git add . && git commit -m "Update nightly toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update fuzz nightly version and commit
        working-directory: fuzz
        run: |
          cargo rbmt toolchains --update-nightly
          if git add . && git commit -m "fuzz: update nightly toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update protocol/bitcoind-tests nightly version and commit
        working-directory: protocol/bitcoind-tests
        run: |
          cargo rbmt toolchains --update-nightly
          if git add . && git commit -m "bitcoind-tests: update nightly toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update traffic/bitcoind-tests nightly version and commit
        working-directory: traffic/bitcoind-tests
        run: |
          cargo rbmt toolchains --update-nightly
          if git add . && git commit -m "bitcoind-tests: update nightly toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update stable version and commit
        run: |
          cargo rbmt toolchains --update-stable
          if git add . && git commit -m "Update stable toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update protocol/bitcoind-tests stable version and commit
        working-directory: protocol/bitcoind-tests
        run: |
          cargo rbmt toolchains --update-stable
          if git add . && git commit -m "bitcoind-tests: update stable toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Update traffic/bitcoind-tests stable version and commit
        working-directory: traffic/bitcoind-tests
        run: |
          cargo rbmt toolchains --update-stable
          if git add . && git commit -m "bitcoind-tests: update stable toolchain"; then
            echo "TOOLCHAIN_UPDATE=true" >> $FORGEJO_ENV
          fi
      - name: Create pull request
        if: ${{ env.TOOLCHAIN_UPDATE == 'true' }}
        run: |
          git push origin HEAD:refs/for/main/update-toolchains \
            -o title="Update toolchains" \
            -o description="Automated update to toolchains by update-toolchains workflow."